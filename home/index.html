const HOME_ONLY = 'This is the home view. Changes are made in the app on the office computer.';

// one formatter each, made once: making a new one for every amount is slow on long lists
const NF0 = new Intl.NumberFormat('en-IN'), NF2 = new Intl.NumberFormat('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}), NFQ = new Intl.NumberFormat('en-IN', {maximumFractionDigits: 2});
function inr(n) { const a = Math.round(Math.abs(n)); return (n < 0 ? '−' : '') + '₹' + NF0.format(a); }
function exact(n) { return (n < 0 ? '−' : '') + '₹' + NF2.format(Math.abs(n)); }
function short(n) {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e7) return s + '₹' + NFQ.format(a / 1e7) + ' crore';
  if (a >= 1e5) return s + '₹' + NFQ.format(a / 1e5) + ' lakh';
  return inr(n);
}
function qty(q, unit) { return (q < 0 ? '−' : '') + NFQ.format(Math.abs(q)) + (unit ? ' ' + unit : ''); }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 2600); }

const S = {
  tab: 'home', company: '', companies: [], dash: null, status: null, prefs: {features: {customers: true, stock: true, checks: true, expenses: true}, text_size: 'large', interest_rate: 12, hidden: {}, bank: {stock_margin: 25, debt_margin: 40, debt_days: 90, limit: 0}},
  custSeg: 'all', custSearch: '', custShow: 30, open: {}, allAlerts: false, answers: {}, setupMsg: '', error: '', partyKind: 'customer',
};
const on = f => S.prefs.features[f] !== false;

async function api(path, opts) { if (CLOUD) return cloudApi(path, opts); const r = await fetch(path, opts); return r.json(); }
const post = (path, body) => api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});

async function boot() {
  const h = (location.hash || '').slice(1);if (['home', 'payments', 'proforma', 'customers', 'stock', 'checks', 'books', 'more', 'bank'].includes(h)) S.tab = h;
  if (h === 'suppliers') { S.tab = 'customers'; S.partyKind = 'supplier'; }
  if (SNAP) { S.dash = SNAP; S.company = SNAP.company; S.status = {ok: true, version: SNAP.version}; S.companies = [{name: SNAP.company}]; applyPrefs(); return render(); }
  if (CLOUD) return cloudBoot();
  try { S.prefs = await api('/api/prefs'); } catch (e) {}
  applyPrefs();
  await connect();
}

async function connect() {
  S.status = await api('/api/status');
  if (!S.status.ok) { S.setupMsg = S.status.message; S.dash = null; return render(); }
  const cs = await api('/api/companies');
  if (!cs.ok) { S.setupMsg = cs.message; S.status.ok = false; return render(); }
  S.companies = cs.companies;
  const saved = localStorageGet('company');
  S.company = (S.companies.find(c => c.name === S.company) || S.companies.find(c => c.name === saved) || S.companies[0]).name;
  await load(false);
}

function localStorageGet(k) { try { return localStorage.getItem('dw-' + k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem('dw-' + k, v); } catch (e) {} }

async function load(refresh, full) {
  if (SNAP) return toast('This preview has no Tally connected.');
  if (CLOUD) return cloudOpen(S.company);
  S.error = '';
  $('overlay').classList.remove('hidden');
  $('ovTitle').textContent = 'Reading ' + S.company + '…';
  $('ovBar').style.width = '3%'; $('ovStep').textContent = 'Connecting to Tally';
  const poll = setInterval(async () => {
    try {
      const p = await api('/api/progress?company=' + encodeURIComponent(S.company));
      if (p.total) { $('ovBar').style.width = Math.max(3, Math.round(p.done / p.total * 100)) + '%'; $('ovStep').textContent = p.step + ' (' + p.done + ' of ' + p.total + ')'; }
    } catch (e) {}
  }, 700);
  try {
    const r = await api('/api/dashboard?company=' + encodeURIComponent(S.company) + (refresh ? '&refresh=1' : '') + (full ? '&full=1' : ''));
    if (r.ok) { S.dash = r.dashboard; S.bk = {}; localStorageSet('company', S.company); } else { S.error = r.message; S.dash = null; }
  } catch (e) { S.error = 'Something went wrong while reading: ' + e; }
  clearInterval(poll);
  $('overlay').classList.add('hidden');
  render();
}

function applyPrefs() { document.documentElement.className = 'ts-' + (S.prefs.text_size || 'large'); }

function go(tab, focus) {
  S.stack = [];
  if (tab === 'suppliers') { tab = 'customers'; S.partyKind = 'supplier'; if (focus) S.open['s' + Math.abs(hash(focus))] = true; }
  else if (tab === 'customers') { S.partyKind = 'customer'; if (focus) { S.custSeg = 'all'; S.custSearch = ''; S.custShow = 9999; S.open['c' + Math.abs(hash(focus))] = true; } }
  if (tab === 'checks' && focus) S.open['k-' + focus] = true;
  if (tab === 'stock' && focus && S.dash) { // a jump from Home to an item far down a long list: show enough of that list
    const st = S.dash.stock;
    [['st-neg', st.negative], ['st-low', st.low], ['st-fast', st.fast], ['st-dead', st.dead]].forEach(([k, l]) => { const i = (l || []).findIndex(r => r.name === focus); if (i >= 0) S.shown = Object.assign(S.shown || {}, {[k]: Math.max((S.shown || {})[k] || 0, i + 1)}); });
  }
  S.focus = focus || '';
  S.tab = tab; try { history.replaceState(null, '', '#' + tab); } catch (e) {} render(); window.scrollTo(0, 0); }

// ---------- opening any figure to its entries, and Tally's books (explore.go) ----------
// S.stack holds the screens opened on top of a tab, newest last. The phone's Back
// button closes them one at a time.
S.stack = []; S.bk = {};
function openV(v, p) {
  if (SNAP) return toast('Open the app on the Tally computer to see the entries.');
  S.stack.push({v, p: Object.assign({}, p || {}), shown: {}});
  try { history.pushState({dw: S.stack.length}, ''); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function backV() {
  if (!S.stack.length) return;
  try { history.back(); } catch (e) { S.stack.pop(); render(); }
}
window.addEventListener('popstate', () => { if (S.stack.length) { S.stack.pop(); render(); window.scrollTo(0, 0); } });
function topV() { return S.stack[S.stack.length - 1]; }
function setP(p) { const t = topV(); if (!t) return; Object.assign(t.p, p); t.shown = {}; render(); }
function showMore(k, n) { const t = topV(); t.shown[k] = n; render(); }
const ja = o => esc(JSON.stringify(o));
// open a figure: figure ids come from the engine (home.drill, bars)
function fig(id) { if (id) openV('fig', {id}); }
const openLed = name => openV('led', {name});
const openItem = name => openV('item', {name});
const openVch = id => openV('vch', {id});

function bk(p) {
  const q = new URLSearchParams(Object.assign({company: S.company}, p)).toString();
  let c = S.bk[q];
  if (!c) {
    c = S.bk[q] = {loading: true};
    api('/api/books?' + q).then(j => { S.bk[q] = j.ok ? {data: j.data} : {error: j.message || 'Could not read this.'}; render(); })
      .catch(e => { S.bk[q] = {error: 'Could not reach the app: ' + e}; render(); });
  }
  return c;
}

function drcr(n) { // Tally's sign: debit negative
  if (Math.abs(n) < 0.005) return '₹0.00';
  return exact(Math.abs(n)) + (n < 0 ? ' Dr' : ' Cr');
}
function tapAttrs(js) { return `class="tap" role="button" tabindex="0" onclick='${js}' onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"`; }
function sumRow(label, value, strong) { return `<div><span class="name">${strong ? `<b>${esc(label)}</b>` : esc(label)}</span><span class="amt" style="text-align:right;${strong ? 'font-size:1.15rem' : ''}">${value}</span></div>`; }
function tiesHtml(ties) {
  if (!ties || !ties.length) return '';
  return `<section><h2>Checked against Tally</h2><div class="list">${ties.map(t => `<div style="flex-wrap:wrap"><span class="name"><b style="color:${t.ok ? 'var(--good)' : 'var(--red)'}">${t.ok ? '✓ Agrees' : '✗ Does not agree'}</b><span class="small">${esc(t.label)}</span>${t.note ? `<span class="tiny muted">${esc(t.note)}</span>` : ''}</span><span class="amt small" style="text-align:right">App ${exact(t.ours)}<br>Tally ${exact(t.tallys)}${t.ok ? '' : `<br><span style="color:var(--red)">Difference ${exact(t.ours - t.tallys)}</span>`}</span></div>`).join('')}</div></section>`;
}
function notesHtml(notes) { return (notes || []).length ? `<section>${notes.map(n => `<p class="small muted">${esc(n)}</p>`).join('')}</section>` : ''; }
function waitHtml(c) {
  if (c.loading) return `<section><p class="muted">Reading…</p></section>`;
  if (c.error) return `<section><div class="note bad">${svg('alert', 22)}<p>${esc(c.error)}</p></div></section>`;
  return '';
}
function xhead(title, sub) {
  return header(title, sub) + `<div class="wrap noprint"><div class="btnrow" style="margin-top:12px"><button class="btn sec" id="xback" onclick="backV()">‹ Back</button></div></div>`;
}
// a long list: the first 100, then a button for more
function paged(key, rows, fn, first) {
  const t = topV(), n = (t && t.shown[key]) || first || 100, left = rows.length - n;
  return rows.slice(0, n).map(fn).join('') + (left > 0 ? `<div><button class="btn sec" onclick="showMore('${key}', ${n + 200})">Show ${Math.min(200, left)} more <span class="small">(${left.toLocaleString('en-IN')} not shown)</span></button></div>` : '');
}
function vRow(r, two) {
  const main = r.qty ? `${qty(r.qty, r.unit)}` : exact(r.amount);
  return `<div ${tapAttrs(`openVch(${ja(r.id)})`)}><span class="name"><b>${esc(r.party || r.type)}</b><span class="small muted">${dmy(r.date)} · ${esc(r.type)} ${esc(r.no)}${r.item ? ' · ' + esc(r.item) : ''}</span>${r.skip ? `<span class="tiny" style="color:var(--orange)">Left out of the figures: ${esc(r.skip)}</span>` : ''}${r.note ? `<span class="tiny muted">${esc(r.note).slice(0, 140)}</span>` : ''}</span><span class="amt" style="text-align:right">${main}${two && r.extra ? `<br><span class="small muted" style="font-weight:600">${exact(r.extra)}</span>` : ''}</span></div>`;
}
function nRow(n, opts = {}) {
  if (n.tally != null) { // Tally's own figure for the same line
    const same = Math.abs(n.amount - n.tally) < 1;
    const t = same ? `<span class="small" style="color:var(--good);font-weight:700">✓ Tally: ${exact(n.tally)}</span>` : `<span class="small" style="color:var(--red);font-weight:700">✗ Tally: ${exact(n.tally)} · difference ${exact(n.amount - n.tally)}</span>`;
    n = Object.assign({}, n, {group: ''});
    const js = `openLed(${ja(n.name)})`;
    return `<div ${tapAttrs(js)}><span class="name"><b>${esc(n.name)}</b>${n.count ? `<span class="small muted">${n.count.toLocaleString('en-IN')} ${n.count === 1 ? 'entry' : 'entries'} in the app</span>` : ''}${t}</span><span class="amt">${exact(n.amount)}</span></div>`;
  }
  const js = n.kind === 'ledger' ? `openLed(${ja(n.name)})` : n.kind === 'group' ? `openV("grp", ${ja({name: n.name})})` : n.kind === 'item' ? `openItem(${ja(n.name)})` : opts.click ? opts.click(n) : '';
  const amt = opts.drcr ? drcr(n.amount) : n.kind === 'item' && opts.qtyOnly ? qty(n.qty, n.unit) : exact(n.amount);
  const sub = [n.group ? esc(n.group) : '', n.kind === 'item' && n.qty ? qty(n.qty, n.unit) : '', n.count ? n.count.toLocaleString('en-IN') + (n.count === 1 ? ' entry' : ' entries') : ''].filter(Boolean).join(' · ');
  return `<div ${js ? tapAttrs(js) : ''}><span class="name"><b>${esc(n.name || '(no name)')}</b>${sub ? `<span class="small muted">${sub}</span>` : ''}</span><span class="amt">${amt}</span></div>`;
}
function addMonths(isoDay, n) { const [y, m] = isoDay.split('-').map(Number); return new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 10); }
function periodList(withToday) {
  const d = S.dash, t = d.today_iso, y = d.year_from_iso, h = d.history_from_iso, ms = t.slice(0, 8) + '01';
  const out = [['This month', ms, t], ['Last month', addMonths(ms, -1), addDays(ms, -1)], ['This year', y, t], ['Last year', addMonths(y, -12) < h ? h : addMonths(y, -12), addDays(y, -1)], ['Everything read', h, t]];
  if (withToday) out.unshift(['Today', t, t]);
  return out;
}
function periodChips(p, withToday) {
  const list = periodList(withToday);
  return `<section class="noprint"><div class="chips">${list.map(([l, f, t]) => `<button class="chip" aria-pressed="${p.from === f && p.to === t}" onclick="setP({from:'${f}',to:'${t}'})">${l}</button>`).join('')}</div>
    <div class="daterow"><label class="field">From<input type="date" value="${esc(p.from || '')}" min="${S.dash.history_from_iso}" max="${S.dash.today_iso}" onchange="setP({from:this.value})"></label><label class="field">To<input type="date" value="${esc(p.to || '')}" min="${S.dash.history_from_iso}" max="${S.dash.today_iso}" onchange="setP({to:this.value})"></label></div></section>`;
}

function exploreView(t) {
  const f = {fig: figV, vch: vchV, led: ledV, grp: grpV, item: itemV, items: itemsV, db: dbV, reg: regV, find: findV}[t.v];
  return f ? f(t.p) : xhead('Not found');
}

// ---- a figure from the screens ----
function figV(p) {
  const c = bk({what: 'fig', id: p.id}), d = c.data;
  if (!d) return xhead('Opening the figure') + `<div class="wrap">${waitHtml(c)}</div>`;
  const isQty = d.kind === 'lines';
  const big = isQty ? qty(d.total, '') : exact(d.total);
  const namesTitle = {entries: d.title.startsWith('Money') ? 'By cash and bank ledger' : 'By sales ledger', lines: 'By item'}[d.kind];
  return xhead(d.title, d.sub) + `<div class="wrap">
    <section class="card"><span class="small muted">${esc(d.label)}</span><div class="amtbig" style="font-size:1.8rem">${big}</div>${d.label2 ? `<span class="small muted">${esc(d.label2)}: <b>${exact(d.total2)}</b></span>` : ''}<p class="small">${esc(d.how)}</p></section>
    ${tiesHtml(d.ties)}
    ${(d.kind === 'ledgers' || d.kind === 'items') ? listWithSearch('n', d.names, n => nRow(n, {}), d.kind === 'items' ? 'Search an item' : 'Search a name') : ''}
    ${namesTitle && d.names.length ? `<section><h2>${namesTitle}</h2><div class="list">${d.names.map(n => nRow(n, isQty ? {qtyOnly: true} : {})).join('')}</div></section>` : ''}
    ${d.rows && d.rows.length ? `<section><h2>The ${d.rows.length.toLocaleString('en-IN')} ${d.rows.length === 1 ? 'entry' : 'entries'}${d.col2 ? ` <span class="small muted">(${esc(d.col)}; below it ${esc(d.col2).toLowerCase()})</span>` : ''}</h2><div class="list">${paged('rows', d.rows, r => vRow(r, !!d.col2))}</div></section>` : (d.kind === 'entries' || d.kind === 'lines' ? `<section><p class="muted">No entries in these dates.</p></section>` : '')}
    ${(d.extra || []).map(x => `<section><h2>${esc(x.title)}: ${exact(x.total)}</h2>${tiesHtml(x.ties).replace('<h2>Checked against Tally</h2>', '')}<div class="list">${x.names.length ? x.names.map(n => nRow(n, {})).join('') : '<div><span class="muted">None.</span></div>'}</div></section>`).join('')}
    ${notesHtml(d.notes)}
  </div>`;
}
function listWithSearch(key, rows, fn, placeholder) {
  const t = topV(), q = ((t.p.q || '') + '').trim().toLowerCase();
  const list = q ? rows.filter(r => (r.name || '').toLowerCase().includes(q)) : rows;
  return `<section>${rows.length > 15 ? `<input type="search" id="xq" placeholder="${esc(placeholder)}" value="${esc(t.p.q || '')}" oninput="setP({q:this.value})" style="margin-bottom:10px">` : ''}
    <div class="list">${list.length ? paged(key, list, fn) : '<div><span class="muted">Nothing matches.</span></div>'}</div></section>`;
}

// ---- one entry, as in Tally ----
function vchV(p) {
  const c = bk({what: 'voucher', id: p.id}), v = c.data;
  if (!v) return xhead('Opening the entry') + `<div class="wrap">${waitHtml(c)}</div>`;
  const dr = v.entries.reduce((s, e) => s + (e.dr || 0), 0), cr = v.entries.reduce((s, e) => s + (e.cr || 0), 0);
  return xhead(`${v.type} ${v.no}`.trim(), dmy(v.date)) + `<div class="wrap">
    ${v.skip ? `<section><div class="note">${svg('alert', 22)}<p><b>Left out of the app's figures:</b> ${esc(v.skip)}.</p></div></section>` : ''}
    <section class="card">
      ${v.party ? `<div><span class="small muted">Party</span><br><button class="linkname" style="font-weight:800;font-size:1.15rem" onclick='openLed(${ja(v.party)})'>${esc(v.party)}</button></div>` : ''}
      <div class="small">${esc(v.type)} · no. ${esc(v.no || '—')} · ${dmy(v.date)}${v.ref ? ' · their bill no. ' + esc(v.ref) : ''}</div>
      ${v.note ? `<p class="small muted">${esc(v.note)}</p>` : ''}
      <div class="amtrow"><span class="amtbig">${exact(v.total)}</span>${v.sales ? `<span class="small muted">sales value without GST ${exact(v.sales)}</span>` : ''}</div>
    </section>
    <section><h2>Ledger lines</h2><div class="tablebox card" style="padding:8px"><table><tr><th>Ledger</th><th class="num">Debit</th><th class="num">Credit</th></tr>
      ${v.entries.map(e => `<tr><td><button class="linkname" onclick='openLed(${ja(e.ledger)})'>${esc(e.ledger)}</button><div class="tiny muted">${esc(e.group)}</div></td><td class="num">${e.dr ? exact(e.dr) : ''}</td><td class="num">${e.cr ? exact(e.cr) : ''}</td></tr>`).join('')}
      <tr><td><b>Total</b></td><td class="num"><b>${exact(dr)}</b></td><td class="num"><b>${exact(cr)}</b></td></tr></table></div>
      <p class="small" style="color:${Math.abs(v.balance) < 0.05 ? 'var(--good)' : 'var(--red)'}">${Math.abs(v.balance) < 0.05 ? '✓ Debit equals credit.' : '✗ Debit and credit differ by ' + exact(Math.abs(v.balance)) + '. Check this entry in Tally.'}</p></section>
    ${v.lines.length ? `<section><h2>Items</h2><div class="tablebox card" style="padding:8px"><table><tr><th>Item</th><th class="num">Quantity</th><th class="num">Rate</th><th class="num">Amount</th></tr>
      ${v.lines.map(l => `<tr><td><button class="linkname" onclick='openItem(${ja(l.item)})'>${esc(l.item)}</button>${l.move ? `<div class="tiny muted">${l.move === 'in' ? 'made / brought in' : 'used up / sent out'}</div>` : ''}</td><td class="num">${qty(l.qty, l.unit)}</td><td class="num">${l.rate ? exact(l.rate) : ''}</td><td class="num">${exact(l.amount)}</td></tr>`).join('')}</table></div></section>` : ''}
    ${v.bills.length ? `<section><h2>Bill-wise details in Tally</h2><div class="list">${v.bills.map(b => `<div><span class="name"><b>${esc(b.name || '(no name)')}</b><span class="small muted">${esc({new: 'New Ref', agst: 'Agst Ref', advance: 'Advance', onaccount: 'On Account'}[b.type] || b.type)} · ${esc(b.ledger)}${b.credit ? ' · credit ' + esc(b.credit) : ''}</span></span><span class="amt">${exact(b.amount)}</span></div>`).join('')}</div></section>` : ''}
    ${v.same.length ? `<section><h2>Other entries with the same number</h2><p class="small muted">The same type and number appear more than once. It may be entered twice.</p><div class="list">${v.same.map(r => vRow(r)).join('')}</div></section>` : ''}
    <section><button class="btn sec" onclick='openV("db", ${ja({from: v.date, to: v.date})})'>Day Book for ${dmy(v.date)}</button></section>
  </div>`;
}

// ---- ledger statement ----
function ledV(p) {
  if (!p.from) Object.assign(p, {from: S.dash.year_from_iso, to: S.dash.today_iso});
  const c = bk({what: 'ledger', name: p.name, from: p.from, to: p.to}), L = c.data;
  if (!L) return xhead(p.name) + `<div class="wrap">${waitHtml(c)}</div>`;
  const path = L.path.map(g => `<button class="linkname" onclick='openV("grp", ${ja({name: g})})'>${esc(g)}</button>`).join(' › ');
  const row = r => `<div ${tapAttrs(`openVch(${ja(r.id)})`)}><span class="name"><b>${esc(r.other || r.type)}</b><span class="small muted">${dmy(r.date)} · ${esc(r.type)} ${esc(r.no)}</span>${r.note ? `<span class="tiny muted">${esc(r.note).slice(0, 140)}</span>` : ''}</span><span class="amt" style="text-align:right">${r.dr ? `<span>${exact(r.dr)} Dr</span>` : `<span style="color:var(--good)">${exact(r.cr)} Cr</span>`}<br><span class="small muted" style="font-weight:600">bal ${drcr(r.bal)}</span></span></div>`;
  const isParty = L.kind === 'customer' || L.kind === 'supplier';
  return xhead(L.name, L.kind ? 'Ledger · ' + L.kind : 'Ledger') + `<div class="wrap">
    <section><p class="small">Group: ${path || esc(L.group)}${L.credit_days ? ' · credit period in Tally: ' + esc(L.credit_days) : ''}</p></section>
    ${periodChips(p)}
    <section class="card"><div class="list" style="border:0">
      ${sumRow('Opening on ' + dmy(L.from), drcr(L.opening))}${sumRow('Debits in these dates', exact(L.total_dr))}${sumRow('Credits in these dates', exact(L.total_cr))}${sumRow('Closing on ' + dmy(L.to), drcr(L.closing), true)}</div>
      <div class="btnrow noprint">${shareBtns(L)}${isParty ? `<button class="btn sec" onclick='payOpen(${ja(L.name)}, ${ja(L.kind === 'supplier' ? 'pay' : 'receive')})'>Bills pending</button>` : ''}</div></section>
    ${tiesHtml(L.ties)}
    <section><h2>${L.rows.length.toLocaleString('en-IN')} ${L.rows.length === 1 ? 'entry' : 'entries'}</h2><div class="list">
      <div><span class="name"><b>Opening balance</b><span class="small muted">${dmy(L.from)}</span></span><span class="amt">${drcr(L.opening)}</span></div>
      ${paged('rows', L.rows, row)}

// ---------- the home view (window.DW_CLOUD): figures the office computer sent ----------
// Signs in to Supabase, opens the latest copy the office sent, and asks the
// same program (dw.wasm, home_wasm.go) about the books for every drill-down.
const CS = {sess: null, idx: null, booksReady: null, booksDone: false};
function csSaved() { try { return JSON.parse(localStorage.getItem('dw_home') || 'null'); } catch (e) { return null; } }
function csKeep(x) { try { x ? localStorage.setItem('dw_home', JSON.stringify(x)) : localStorage.removeItem('dw_home'); } catch (e) {} }
async function sbAuth(grant, body) {
  const r = await fetch(CLOUD.url + '/auth/v1/token?grant_type=' + grant, {method: 'POST', headers: {apikey: CLOUD.key, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) throw new Error(j.error_code === 'invalid_credentials' ? 'That email and password did not match. Use the ones set on the office computer (More › See it from home).' : (j.error_description || j.msg || 'Sign-in refused (' + r.status + ')'));
  CS.sess = {access: j.access_token, exp: Date.now() + (j.expires_in - 60) * 1000, email: j.user.email, uid: j.user.id};
  csKeep({refresh: j.refresh_token, email: j.user.email, uid: j.user.id});
  return CS.sess;
}
async function sbBearer() {
  if (CS.sess && Date.now() < CS.sess.exp) return CS.sess.access;
  const saved = csSaved();
  if (!saved || !saved.refresh) throw new Error('signin');
  try { await sbAuth('refresh_token', {refresh_token: saved.refresh}); } catch (e) { csKeep(null); throw new Error('signin'); }
  return CS.sess.access;
}
async function sbGet(path) {
  const r = await fetch(CLOUD.url + '/storage/v1/object/authenticated/snapshots/' + path, {headers: {apikey: CLOUD.key, Authorization: 'Bearer ' + await sbBearer()}, cache: 'no-store'});
  if (r.status === 400 || r.status === 404) return null;
  if (!r.ok) throw new Error('The store said ' + r.status);
  return r;
}
async function gunzipText(r) { return await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text(); }
let wasmP = null;
function wasmReady() {
  if (!wasmP) wasmP = new Promise((res, rej) => {
    window.dwReady = res;
    const g = new Go();
    const start = r => g.run(r.instance);
    WebAssembly.instantiateStreaming(fetch('dw.wasm'), g.importObject).then(start)
      .catch(() => fetch('dw.wasm').then(r => r.arrayBuffer()).then(b => WebAssembly.instantiate(b, g.importObject)).then(start).catch(rej));
  });
  return wasmP;
}
function cloudWhen() {
  const t = S.cloudTaken ? new Date(S.cloudTaken) : null;
  return t ? t.toLocaleString('en-IN', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'}) : '';
}
async function cloudBoot() {
  S.status = {ok: true, version: CLOUD.version};
  const saved = csSaved();
  if (!saved) { S.cloudView = 'signin'; return render(); }
  await cloudOpen(localStorageGet('company'));
}
async function cloudSignIn() {
  const email = $('hvEmail').value.trim(), pw = $('hvPass').value;
  S.cloudErr = ''; $('hvGo').disabled = true; $('hvGo').textContent = 'Signing in…';
  try { await sbAuth('password', {email, password: pw}); await cloudOpen(); }
  catch (e) { S.cloudErr = e.message; S.cloudView = 'signin'; render(); }
}
function cloudSignOut() { csKeep(null); CS.sess = null; S.dash = null; S.cloudView = 'signin'; S.stack = []; render(); }
async function cloudOpen(company) {
  S.cloudView = 'loading'; S.cloudErr = ''; render();
  try {
    await sbBearer();
    const uid = csSaved().uid;
    const ir = await sbGet(uid + '/index.json');
    if (!ir) { S.cloudView = 'empty'; return render(); }
    CS.idx = await ir.json();
    const list = (CS.idx.companies || []).slice().sort((a, b) => b.taken_at.localeCompare(a.taken_at));
    if (!list.length) { S.cloudView = 'empty'; return render(); }
    const c = list.find(x => x.name === company) || list[0];
    S.companies = list.map(x => ({name: x.name}));
    const dr = await sbGet(uid + '/' + c.id + '.dash.json.gz');
    if (!dr) { S.cloudView = 'empty'; return render(); }
    const pack = JSON.parse(await gunzipText(dr));
    S.dash = pack.dashboard; S.prefs = Object.assign({}, pack.prefs || {}, {text_size: (csSaved() || {}).text_size || (pack.prefs || {}).text_size});
    S.company = c.name; S.cloudTaken = pack.head.taken_at; S.bk = {}; S.stack = []; S.cloudView = '';
    localStorageSet('company', c.name); applyPrefs(); render();
    CS.booksDone = false;
    CS.booksReady = (async () => {       // the books, for opening figures: in the background
      await wasmReady();
      const br = await sbGet(uid + '/' + c.id + '.books.json.gz');
      if (!br) throw new Error('The books are not there yet. Send again from the office computer.');
      const err = dwOpenBooks(await gunzipText(br));
      if (err) throw new Error(err);
      CS.booksDone = true;
    })();
    CS.booksReady.then(() => { S.bk = {}; render(); }).catch(e => { S.cloudErrBooks = e.message; S.bk = {}; render(); });
  } catch (e) {
    if (e.message === 'signin') { S.cloudView = 'signin'; S.cloudErr = 'Please sign in again.'; }
    else { S.cloudView = 'error'; S.cloudErr = String(e.message || e); }
    render();
  }
}
async function cloudApi(path, opts) {
  const [p, q] = path.split('?');
  const write = opts && opts.method && opts.method !== 'GET';
  if (p === '/api/books') {
    try { await CS.booksReady; } catch (e) { return {ok: false, message: S.cloudErrBooks || String(e.message || e)}; }
    return JSON.parse(dwBooks(q || ''));
  }
  if (p === '/api/dashboard') return {ok: true, dashboard: S.dash};
  if (p === '/api/prefs' && !write) return S.prefs;
  if (p === '/api/prefs' && write) { // only the text size, kept in this browser
    const b = JSON.parse(opts.body || '{}');
    if (b.text_size) { S.prefs.text_size = b.text_size; const s = csSaved(); if (s) { s.text_size = b.text_size; csKeep(s); } }
    return S.prefs;
  }
  return {ok: false, message: HOME_ONLY};
}
function cloudPDF(L, mode) {
  if (!CS.booksDone) return toast('The books are still opening. Please wait a moment.');
  const bytes = dwStatementPDF(stmtQuery(L));
  if (!bytes) return toast('Could not make the statement.');

// One from each kind first (worst tone, then most rupees), so the top three are not all about customers.
function rankAlerts(list) {
  const tr = {red: 0, orange: 1, blue: 2};
  const better = (a, b) => ((tr[a.tone] ?? 3) - (tr[b.tone] ?? 3)) || ((b.amount || 0) - (a.amount || 0));
  const kinds = [...new Set(list.map(a => a.kind))];
  const tops = kinds.map(k => list.filter(a => a.kind === k).sort(better)[0]).sort(better).slice(0, 3);
  return tops.concat(list.filter(a => !tops.includes(a)));
}

// ---------- bank statement ----------
function bankTerms() { return Object.assign({stock_margin: 25, debt_margin: 40, debt_days: 90, limit: 0}, S.prefs.bank || {}); }
function bankCalc(b, t) {
  const paid = Math.max(0, b.stock - b.creditors_goods);
  const stockDP = paid * (1 - t.stock_margin / 100);
  const eligible = (b.ages || []).filter(a => a.up_to > 0 && a.up_to <= t.debt_days).reduce((s, a) => s + a.amount, 0);
  const debtDP = eligible * (1 - t.debt_margin / 100);
  const dp = stockDP + debtDP;
  const avail = t.limit > 0 ? Math.min(dp, t.limit) : dp;
  return {paid, stockDP, eligible, debtDP, dp, avail, room: avail - b.od_used};
}

    <section class="card"><span class="small muted">${esc(S.dash.company)} · as on ${esc(b.as_on)}</span><h2>Drawing power</h2>

      <p class="tiny muted">Prepared with Dheer Works from Tally. Check figures against Tally and your bank's format before signing.</p></section>
    <div class="btnrow noprint"><button class="btn" onclick="window.print()">Print</button><button class="btn sec" onclick="copyBank()">Copy as text</button><button class="btn sec" onclick="go('more')">Back</button></div>
  </div></div></div>`;

async function saveBank() {
  const num = id => parseFloat(String($(id).value).replace(/,/g, ''));
  const t = {stock_margin: num('bkSM'), debt_margin: num('bkDM'), debt_days: parseInt($('bkDD').value, 10), limit: num('bkLim') || 0};
  if (!(t.stock_margin >= 0 && t.stock_margin <= 100 && t.debt_margin >= 0 && t.debt_margin <= 100)) return toast('Margins must be between 0 and 100');
  S.prefs.bank = t;
  if (!SNAP) S.prefs = await post('/api/prefs', {bank: t});
  toast('Saved'); render();
}
function copyBank() {
  const b = S.dash.bank, t = bankTerms(), c = bankCalc(b, t);
  const lines = [S.dash.company + ' – stock and debtor statement as on ' + b.as_on, '',
    'Stock: ' + exact(b.stock), 'Less creditors for goods: ' + exact(b.creditors_goods), 'Paid stock: ' + exact(c.paid),
    'Drawing power on stock (' + t.stock_margin + '% margin): ' + exact(c.stockDP), '',
    'Total debtors: ' + exact(b.debtors), 'Debtors up to ' + t.debt_days + ' days: ' + exact(c.eligible),
    'Drawing power on debtors (' + t.debt_margin + '% margin): ' + exact(c.debtDP), '',
    'Total drawing power: ' + exact(c.dp), 'Used on ' + b.as_on + ': ' + exact(b.od_used), '',
    'Debtors by age:', ...b.ages.map(a => '  ' + a.label + ': ' + exact(a.amount))];
  copyText(lines.join('\n'));
}

// Call today: each row can be sent a WhatsApp, marked as called, or opened.
function calledKey(name) { return S.company + '|' + name; }
function isCalled(x) {
  const d = (S.prefs.called || {})[calledKey(x.name)];
  if (!d || !S.dash.today_iso) return false;
  const days = (new Date(S.dash.today_iso) - new Date(d)) / 864e5;
  return days < Math.max(3, x.gap_days);
}
async function markCalled(name, on) {
  const d = on ? S.dash.today_iso : '';
  S.prefs.called = Object.assign({}, S.prefs.called || {}, {[calledKey(name)]: d});
  if (!on) delete S.prefs.called[calledKey(name)];
  render();
  if (on) toast('Marked as called. It comes back if they still have not ordered after their usual gap.');

function manualList() {
  const s = S.dash.summary;
  const list = [
    {key: 'debtors', label: 'Sundry Debtors total', value: s.debtors_net, where: 'Balance Sheet → Current Assets → Sundry Debtors'},
    {key: 'creditors', label: 'Sundry Creditors total', value: s.creditors_net, where: 'Balance Sheet → Current Liabilities → Sundry Creditors'},
    {key: 'cash', label: 'Cash-in-Hand', value: s.cash, where: 'Balance Sheet → Current Assets → Cash-in-Hand'},
    {key: 'bank', label: 'Bank Accounts', value: s.bank, where: 'Balance Sheet → Current Assets → Bank Accounts'},
    {key: 'stock', label: 'Closing stock value', value: s.stock_value, where: 'Stock Summary → Grand Total, closing value'},
    {key: 'salestoday', label: 'Sales today', value: S.dash.home.sales_today, where: 'Day Book for today, sales vouchers (without GST)'},
  ];
  if (s.top_debtors && s.top_debtors[0]) list.push({key: 'topdebtor', label: 'Biggest customer balance: ' + s.top_debtors[0].name, value: s.top_debtors[0].amount, where: 'Open the ledger "' + s.top_debtors[0].name + '"'});
  return list;
}
function manualChecks() {
  return manualList().map(c => `<div class="checkrow" id="chk-${c.key}"><b>${esc(c.label)}</b><span style="font-size:1.2rem;font-weight:800">${exact(c.value)}</span><span class="tiny muted">In Tally: ${esc(c.where)}</span>
    <div class="answers">${[['yes', 'Matches'], ['no', 'Does not match'], ['unsure', 'Not sure']].map(([v, l]) => `<button class="${v} ${S.answers[c.key] === v ? 'on' : ''}" onclick="answer('${c.key}','${v}')">${l}</button>`).join('')}</div></div>`).join('');
}
async function answer(key, value) {
  const c = manualList().find(x => x.key === key);
  let note = '';
  if (value === 'no' && !SNAP) { try { note = prompt('What figure does Tally show? (optional)') || ''; } catch (e) {} }
  S.answers[key] = value;
  $('manual').innerHTML = manualChecks();
  if (!SNAP) await post('/api/check', {company: S.company, check: {key, label: c.label, answer: value, app_value: exact(c.value), note}});
}

async function updCheck() {
  if (SNAP) return toast('Not in the preview.');
  S.upd = Object.assign(await api('/api/update/check'), {checked: true}); render();
}
function updWait(v) {
  $('overlay').classList.remove('hidden'); $('ovTitle').textContent = 'Updating to version ' + v + '…';
  $('ovStep').textContent = 'The screen comes back by itself in a few seconds.'; $('ovBar').style.width = '60%';
  const t0 = Date.now();
  const tick = async () => {
    try { const r = await api('/api/version'); if (r.version === v) { $('ovBar').style.width = '100%'; return location.reload(); } } catch (e) {}
    if (Date.now() - t0 > 90000) { $('ovTitle').textContent = 'The update is taking long.'; $('ovStep').textContent = 'Close this window and open DheerWorks.exe again.'; return; }
    setTimeout(tick, 800);
  };
  setTimeout(tick, 1200);
}
async function updInstall() {
  $('overlay').classList.remove('hidden'); $('ovTitle').textContent = 'Downloading version ' + S.upd.latest + '…'; $('ovStep').textContent = 'Checking it before anything is changed.'; $('ovBar').style.width = '20%';
  const r = await post('/api/update/install');
  if (!r.ok) { $('overlay').classList.add('hidden'); S.upd.message = r.message; return render(); }
  updWait(r.version);
}
async function updFromFile(input, older) {
  if (SNAP) return toast('Not in the preview.');
  const f = input.files && input.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f); if (older) fd.append('older', '1');
  $('overlay').classList.remove('hidden'); $('ovTitle').textContent = 'Checking ' + f.name + '…'; $('ovStep').textContent = 'Nothing is changed until it passes the checks.'; $('ovBar').style.width = '30%';
  const r = await (await fetch('/api/update/file', {method: 'POST', body: fd})).json();
  if (!r.ok) {
    $('overlay').classList.add('hidden');
    if (!older && /you already have/.test(r.message || '') && confirm(r.message + '\n\nUse that version anyway?')) return updFromFile(input, true);
    input.value = ''; S.upd = Object.assign(S.upd || {}, {message: r.message}); return render();
  }
  updWait(r.version);
}
async function updPrevious() {
  if (!confirm('Go back to version ' + S.upd.previous + '? Your data stays as it is.')) return;
  const r = await post('/api/update/previous');
  if (!r.ok) { S.upd.message = r.message; return render(); }
  updWait(r.version);
}
async function bkLoad() { if (SNAP) return toast('Not in the preview.'); S.bk = await api('/api/backup'); render(); }
async function bkFolder() {
  const r = await post('/api/backup', {action: 'folder', dir: $('bkDir').value});

  S.bk = r; toast('Folder saved'); render();

async function bkNow() {
  const dir = $('bkDir').value;
  if (dir !== S.bk.dir) { const f = await post('/api/backup', {action: 'folder', dir}); if (!f.ok) return toast(f.message); }
  const r = await post('/api/backup', {action: 'now'});
  if (!r.ok) return toast(r.message);
  S.bk = r; toast('Backed up: ' + r.files + ' files'); render();
}
async function bkRestore(name) {
  if (!confirm('Put back the app\'s data from this backup? What is there now is backed up first.')) return;
  const r = await post('/api/backup', {action: 'restore', name});
  if (!r.ok) return toast(r.message);
  S.bk = r; S.pfData = null; toast('Restored'); location.reload();
}

// ---------- payments: to receive and to pay, bill by bill ----------
const DUE_FROM = {app: 'set here for this bill', 'tally-bill': 'from the bill in Tally', narration: "from the bill's narration", rule: 'your rule', 'app-party': "the party's usual days, set here", 'tally-party': "the party's credit period in Tally", default: 'your default credit days'};
// a bill's terms in one tap: the due date is the bill date plus these days
const QUICK_DAYS = [0, 15, 30, 45, 60, 90];
function quickDays(b) {
  return `<span class="chips" style="gap:6px">${QUICK_DAYS.map(n => `<button class="chip" style="min-height:40px;padding:0 12px" aria-pressed="${b.due === addDays(b.date, n) && b.due_from === 'app'}" onclick='payPost({action:"due", bill: ${ja(b.id)}, date: ${ja(addDays(b.date, n))}})'>${n === 0 ? 'Cash' : n + ' days'}</button>`).join('')}</span>`;
}
// bills of the last 60 days that have no terms of their own: one tap each
function payNeedTerms(side, recv) {
  const since = addDays(S.dash.payments.today, -60), keepP = notRemoved('party');
  const list = [];
  for (const p of side.parties) if (keepP(p)) for (const b of p.bills) if (!b.opening && b.date >= since && ['app-party', 'tally-party', 'default'].includes(b.due_from)) list.push([p, b]);
  if (!list.length) return '';
  list.sort((x, y) => y[1].date.localeCompare(x[1].date));
  const n = (S.payNeedShown || 10), shown = list.slice(0, n);
  return `<section><details class="why" ${S.payNeedOpen ? 'open' : ''} ontoggle="S.payNeedOpen=this.open"><summary>${list.length} new ${list.length === 1 ? 'bill uses' : 'bills use'} the ${recv ? "customer's" : "supplier's"} usual days. Different terms? Set them here.</summary>
    <p class="small muted">Tap the days for each bill. The due date is the bill date plus those days. Bills with credit days typed in Tally, or words like "45 days" in the narration, are not in this list.</p>
    <div class="list">${shown.map(([p, b]) => `<div style="flex-wrap:wrap"><span class="name"><b>${esc(p.name)}</b><span class="small muted">${esc(b.name)} · ${payDate(b.date)} · due ${payDate(b.due)} (${esc(DUE_FROM[b.due_from])})</span></span><span class="amt">${inr(b.balance)}</span><div style="flex-basis:100%">${quickDays(b)}</div></div>`).join('')}</div>
    ${list.length > n ? `<button class="btn sec" onclick="S.payNeedShown=${n + 20};S.payNeedOpen=true;render()">Show ${Math.min(20, list.length - n)} more</button>` : ''}</details></section>`;
}
function payRules(P) {
  const rules = P.rules || [], kinds = {vtype: 'Voucher type', group: 'Stock group'};
  const opts = k => (k === 'group' ? P.groups : P.vtypes) || [];
  const kind = S.ruleKind || (P.groups && P.groups.length ? 'group' : 'vtype');
  return `<section><details class="why" ${S.payRulesOpen ? 'open' : ''} ontoggle="S.payRulesOpen=this.open"><summary>Credit days by kind of sale${rules.length ? ` (${rules.length})` : ''}</summary>
    <p class="small muted">If your terms go with what is sold or the kind of bill (for example Orthodox 60 days, auction lots 15 days), set them once here. A bill's own credit days in Tally, or its narration, still come first.</p>
    ${rules.length ? `<div class="list">${rules.map(r => `<div><span class="name"><b>${esc(r.name)}</b><span class="small muted">${kinds[r.kind]}</span></span><span class="amt">${r.days} days <button class="linkbtn" onclick='payPost({action:"rule", rule: ${ja({kind: r.kind, name: r.name, days: 0})}})'>remove</button></span></div>`).join('')}</div>` : ''}
    <div class="daterow" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));max-width:none">
      <label class="field">By<select id="ruleKind" onchange="S.ruleKind=this.value;render()">${Object.entries(kinds).map(([k, l]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="field">Which<select id="ruleName">${opts(kind).map(n => `<option>${esc(n)}</option>`).join('')}</select></label>
      <label class="field">Credit days<input type="number" id="ruleDays" min="1" max="730" inputmode="numeric" value="30"></label>

}
const HOW = {app: 'as you chose', bill: 'the bill named in Tally', oldest: 'oldest bill first', later: 'advance used for this later bill'};
function payDate(iso) { return dmy(iso); }
function lateText(b) {

const p2 = x => roundAway(x, 100);

const OLD_STATES = {'orissa': 'Odisha', 'pondicherry': 'Puducherry', 'uttaranchal': 'Uttarakhand', 'daman and diu': 'Dadra and Nagar Haveli and Daman and Diu', 'dadra and nagar haveli': 'Dadra and Nagar Haveli and Daman and Diu', 'andaman and nicobar': 'Andaman and Nicobar Islands', 'andaman and nicobar island': 'Andaman and Nicobar Islands', 'telengana': 'Telangana', 'chattisgarh': 'Chhattisgarh', 'new delhi': 'Delhi', 'nct of delhi': 'Delhi'};
// Same as the program's stateOf: a state name it does not know gives '' (the screen asks), never a guess.
function stateOf(gstin, name) {
  const g = String(gstin || '').toUpperCase();
  if (g.length >= 2 && GST_STATES[g.slice(0, 2)]) return GST_STATES[g.slice(0, 2)];
  const n = String(name || '').replace(/&/g, ' and ').trim().split(/\s+/).join(' ').toLowerCase();
  if (!n) return '';
  const c = Object.keys(GST_STATES).find(k => GST_STATES[k].toLowerCase() === n);
  return c ? GST_STATES[c] : (OLD_STATES[n] || '');
}
function gstinOK(g) {
  const cs = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'; g = String(g || '').toUpperCase().trim();
  // layout first (state, PAN or TAN, entity, Z or D): the check digit alone misses a 0 and a Z swapped
  if (!/^[0-9]{2}([A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z|[A-Z]{4}[0-9]{5}[A-Z][1-9A-Z]D)[0-9A-Z]$/.test(g)) return false;
  let sum = 0;
  for (let i = 0; i < 14; i++) { const v = cs.indexOf(g[i]); if (v < 0) return false; const p = v * (1 + i % 2); sum += Math.floor(p / 36) + p % 36; }
  return cs[(36 - sum % 36) % 36] === g[14];
}

function dec4(x) { // a number as typed -> ten-thousandths, fifth decimal rounded half away from zero

}

const halfUp = (n, d) => (n >= 0n ? (2n * n + d) / (2n * d) : -((-2n * n + d) / (2n * d)));
function pfWorkOut(p, seller) {
  p.seller_state = stateOf(seller.gstin, seller.state);
  const buyer = stateOf(p.gstin, p.state); if (buyer) p.state = buyer;
  p.interstate = !!(buyer && p.seller_state && buyer.toLowerCase() !== p.seller_state.toLowerCase());
  let taxable = 0n, cgst = 0n, sgst = 0n, igst = 0n; const by = {};
  for (const l of p.lines) {
    const q = dec4(l.qty), r = dec4(l.rate), g = BigInt(Math.round(l.gst * 100));
    l.qty = Number(q) / 1e4; l.rate = Number(r) / 1e4;
    const amt = halfUp(q * r, 1000000n); l.amount = Number(amt) / 100; taxable += amt;
    const k = String(l.gst), t = by[k] || (by[k] = {rate: Number(g) / 100, taxable: 0n, tax: 0n});

    else { const h = halfUp(amt * g, 20000n); cgst += h; sgst += h; t.tax += 2n * h; }
  }

  Object.assign(p, {taxable: Number(taxable) / 100, cgst: Number(cgst) / 100, sgst: Number(sgst) / 100, igst: Number(igst) / 100, total: Number(total), round_off: Number(total * 100n - gross) / 100});

}
function inWords(amount) {
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const b100 = n => n < 20 ? ones[n] : tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
  const b1000 = n => [n >= 100 ? ones[Math.floor(n / 100)] + ' Hundred' : '', n % 100 ? b100(n % 100) : ''].filter(Boolean).join(' ');

    const parts = [];

// The preview has no program behind it, so it keeps pro formas in memory and works them out here.
function pfLocal(body) {
  const L = S.pfLocal || (S.pfLocal = {seller: {name: S.company, address: 'Chowpatty Road, Alipurduar 736121', gstin: '', state: 'West Bengal', phone: '', email: '', bank: '', terms: 'Prices are for goods ex-godown. Freight extra unless written.', prefix: 'PF', valid_days: 15}, item_tax: {}, next: {}, list: [], last_by: ''});
  if (body.action === 'seller') L.seller = Object.assign({}, body.seller, {state: stateOf(body.seller.gstin, body.seller.state), prefix: (body.seller.prefix || 'PF').toUpperCase()});
  if (body.action === 'status') { const q = L.list.find(x => x.id === body.id); if (q) q.status = body.status; body.saved = q; }
  if (body.action === 'save') {
    const p = pfWorkOut(JSON.parse(JSON.stringify(body.proforma)), L.seller);
    const old = p.id && L.list.find(x => x.id === p.id);
    if (old) { Object.assign(old, p, {number: old.number}); body.saved = old; } else {
      const k = fyOf(p.date); L.next[k] = (L.next[k] || 0) + 1;
      Object.assign(p, {id: 'p' + Date.now(), number: L.seller.prefix + '/' + k + '/' + String(L.next[k]).padStart(3, '0'), status: p.status || 'draft', created: new Date().toISOString()});
      L.list.unshift(p); body.saved = p;
    }
    for (const l of p.lines) L.item_tax[l.item] = {hsn: l.hsn, gst: l.gst};
    if (p.by) L.last_by = p.by;
  }
  const k = fyOf(S.dash.today_iso);
  return {ok: true, seller: L.seller, item_tax: L.item_tax, list: L.list, last_by: L.last_by, saved: body.saved, next_number: L.seller.prefix + '/' + k + '/' + String((L.next[k] || 0) + 1).padStart(3, '0')};
}

function pfHint(l) {

function pfEditView() {
  const c = S.pfCur, items = S.dash.items || [];
  return header(c.id ? 'Change ' + (c.number || 'pro forma') : 'New pro forma', c.id ? '' : 'Number on saving: ' + S.pfData.next_number) + `<div class="wrap">
    <datalist id="pfCusts">${pfCustomers().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <datalist id="pfItems">${items.map(i => `<option value="${esc(i.name)}">`).join('')}</datalist>
    <section class="card"><h2>Customer</h2>
      <label class="field">Name<input type="text" id="pfCust" list="pfCusts" value="${esc(c.customer)}" placeholder="Start typing the customer's name" onchange="pfSetCustomer(this.value)"></label>
      <label class="field">Customer's GSTIN<input type="text" id="pfGstin" maxlength="15" autocapitalize="characters" value="${esc(c.gstin)}" oninput="S.pfCur.gstin=this.value.toUpperCase().trim();pfGstinHint(this,'pfGstinHint','pfState');S.pfCur.state=$('pfState').value;$('pfTotals').innerHTML=pfTotalsHTML()"></label>
      <span class="small" id="pfGstinHint">${c.gstin ? (gstinOK(c.gstin) ? '✓ ' + esc(stateOf(c.gstin, '')) : 'This GSTIN does not look right. Check it.') : 'Leave blank if they are not registered.'}</span>
      <label class="field">State (place of supply)${stateSelect('pfState', stateOf(c.gstin, c.state)).replace('<select', '<select onchange="S.pfCur.state=this.value;$(\'pfTotals\').innerHTML=pfTotalsHTML()"')}</label>
      <label class="field">Address<textarea id="pfAddr" rows="2" oninput="S.pfCur.address=this.value">${esc(c.address)}</textarea></label>
      ${c._from === 'tally' ? '<span class="small" style="color:var(--good);font-weight:600">GSTIN, state and address filled from Tally.</span>' : c._from === 'last' ? '<span class="small muted">Filled from your last pro forma for this customer.</span>' : ''}
    </section>
    <section class="card"><h2>Items</h2>${c.lines.map(pfLineHTML).join('')}
      <button class="btn sec" style="align-self:flex-start" onclick="pfAdd()">+ Add another item</button></section>
    <section class="card"><h2>Total</h2><div id="pfTotals">${pfTotalsHTML()}</div></section>
    <section class="card">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label class="field">Date<input type="date" id="pfDate" value="${esc(c.date)}" onchange="S.pfCur.date=this.value"></label>
        <label class="field">Valid for (days)<input type="text" inputmode="numeric" id="pfValid" value="${esc(c.valid_days)}" oninput="S.pfCur.valid_days=parseInt(this.value,10)||0"></label></div>
      <label class="field">Note for the customer (optional)<textarea id="pfNotes" rows="2" oninput="S.pfCur.notes=this.value" placeholder="For example: delivery in 3 days, 50% advance">${esc(c.notes)}</textarea></label>
      <label class="field">Made by<input type="text" id="pfBy" value="${esc(c.by)}" placeholder="Your name" oninput="S.pfCur.by=this.value"></label>
    </section>
    <section><div class="btnrow"><button class="btn" id="pfSave" onclick="pfSave('view')">Save</button><button class="btn sec" id="pfSaveWa" onclick="pfSave('wa')">Save and send on WhatsApp</button><button class="btn sec" onclick="pfSave('print')">Save and print</button>
      <button class="btn sec" onclick="S.pfMode=S.pfCur.id?'view':'list';S.pfCur=null;render()">Cancel</button></div></section>
  </div>`;
}
async function pfSave(then) {
  const c = S.pfCur, lines = pfLinesNow();
  if (!c.customer.trim()) { toast("Choose or type the customer's name"); return $('pfCust').focus(); }
  const bad = lines.find(l => !l.item || !(l.qty > 0));
  if (bad) return toast('Check the item and quantity in each row');
  if (!lines.length) return toast('Add at least one item');
  const win = then === 'wa' ? window.open('', '_blank') : null; // opened now, or the browser blocks it
  const r = await pfCall({action: 'save', proforma: {id: c.id, customer: c.customer.trim(), gstin: c.gstin, state: c.state, address: c.address, date: c.date, valid_days: c.valid_days, lines, notes: c.notes, by: c.by, status: c.status}});
  if (!r.ok) { if (win) win.close(); return toast(r.message); }
  S.pfData = r; S.pfCur = null; S.pfViewId = r.saved.id; S.pfMode = 'view'; render(); window.scrollTo(0, 0);
  toast('Saved as ' + r.saved.number);
  if (then === 'print') setTimeout(() => window.print(), 300);
  if (win) { win.opener = null; win.location = pfWaLink(r.saved); if (r.saved.status === 'draft') pfStatus(r.saved.id, 'sent'); }
}
function pfText(p) {
  const s = S.pfData.seller, till = addDays(p.date, p.valid_days);
  const lines = p.lines.map((l, i) => `${i + 1}. ${l.item}: ${qty(l.qty, l.unit)} × ${money(l.rate)} = ${money(l.amount)}`).join('\n');
  const tax = p.interstate ? `IGST ${money(p.igst)}` : `CGST ${money(p.cgst)} + SGST ${money(p.sgst)}`;
  return `*PRO FORMA INVOICE ${p.number}*\nFrom: ${s.name}\nTo: ${p.customer}\nDate: ${dmy(p.date)} · valid till ${dmy(till)}\n\n${lines}\n\nValue before GST: ${money(p.taxable)}\n${tax}${p.round_off ? '\nRound off: ' + money(p.round_off) : ''}\n*Total: ${inr(p.total)}*${p.notes ? '\n\n' + p.notes : ''}${s.bank ? '\n\nTo pay:\n' + s.bank : ''}\n\nThis is a pro forma, not a tax invoice.`;
}
function pfWaLink(p) { const c = custRow(p.customer); return waLink(c && c.phone, pfText(p)); }
async function pfStatus(id, st) {
  const r = await pfCall({action: 'status', id, status: st});
  if (!r.ok) return toast(r.message);
  S.pfData = r; render();
}
function pfShowView(p) {
  const st = PF_STATUS[p.status], c = custRow(p.customer);
  return `<div class="noprint">${header(p.number, p.customer)}</div><div class="wrap">
    <section class="noprint"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag ${st[1]}">${st[0]}</span><span class="small muted">${p.updated && p.updated !== p.created ? 'Changed ' + esc(p.updated) : ''}</span></div>
      <div class="btnrow"><a class="btn" id="pfWa" href="${esc(pfWaLink(p))}" target="_blank" rel="noopener" onclick="${p.status === 'draft' ? `pfStatus(${esc(JSON.stringify(p.id))},'sent')` : ''}">Send on WhatsApp</a><button class="btn sec" id="pfPrint" onclick="window.print()">Print or save as PDF</button>
        ${p.status !== 'cancelled' ? `<button class="btn sec" onclick='pfEdit(${esc(JSON.stringify(p.id))})'>Change</button>` : ''}<button class="btn sec" onclick='pfNew("", S.pfData.list.find(x => x.id === ${esc(JSON.stringify(p.id))}))'>Copy to a new one</button></div>
      <span class="tiny muted">${c && c.phone ? 'WhatsApp opens a chat with ' + esc(showPhone(c.phone)) + '.' : 'WhatsApp opens and you choose the contact.'} To send the PDF, print it as PDF first, then attach it.</span>
      <div class="rowbtns">${p.status !== 'sent' && p.status !== 'cancelled' ? `<button class="btn sec" onclick='pfStatus(${esc(JSON.stringify(p.id))},"sent")'>Mark as sent</button>` : ''}${p.status !== 'ordered' && p.status !== 'cancelled' ? `<button class="btn sec" onclick='pfStatus(${esc(JSON.stringify(p.id))},"ordered")'>Customer ordered</button>` : ''}${p.status !== 'cancelled' ? `<button class="btn sec" onclick='if(confirmCancel()) pfStatus(${esc(JSON.stringify(p.id))},"cancelled")'>Cancel it</button>` : `<button class="btn sec" onclick='pfStatus(${esc(JSON.stringify(p.id))},"draft")'>Bring it back</button>`}
        <button class="btn sec" onclick="S.pfMode='list';render()">All pro formas</button></div></section>
    <section>${pfSheet(p)}</section></div>`;
}
function confirmCancel() {
  const t = Date.now();
  if (S.pfConfirm && t - S.pfConfirm < 6000) { S.pfConfirm = 0; return true; }
  S.pfConfirm = t; toast('Tap "Cancel it" again to cancel this pro forma'); return false;
}
function pfSheet(p) {
  const s = S.pfData.seller, till = addDays(p.date, p.valid_days);
  const sc = stateCode(p.seller_state), bc = stateCode(p.state);
  const half = r => pct(r / 2);
  const taxRows = (p.tax_by_rate || []).map(t => p.interstate
    ? `<tr><td class="num">${pct(t.rate)}</td><td class="num">${money(t.taxable)}</td><td class="num">${money(t.tax)}</td></tr>`
    : `<tr><td class="num">${pct(t.rate)}</td><td class="num">${money(t.taxable)}</td><td class="num">${half(t.rate)} · ${money(t.tax / 2)}</td><td class="num">${half(t.rate)} · ${money(t.tax / 2)}</td></tr>`).join('');
  return `<div class="pfsheet" id="pfSheet" tabindex="0" role="region" aria-label="Pro forma ${esc(p.number)}">
    <div class="pfhead"><div><div class="pfname">${esc(s.name)}</div><div>${esc(s.address).replace(/\n/g, '<br>')}</div>
      ${s.gstin ? `<div>GSTIN: <b>${esc(s.gstin)}</b></div>` : ''}<div>State: ${esc(p.seller_state || s.state || '')}${sc ? ' (' + sc + ')' : ''}</div>
      ${s.phone || s.email ? `<div>${esc([s.phone, s.email].filter(Boolean).join(' · '))}</div>` : ''}</div>
      <div class="pfmeta"><div class="pftitle">PRO FORMA INVOICE</div><table><tr><td>No.</td><td><b>${esc(p.number)}</b></td></tr><tr><td>Date</td><td>${esc(dmy(p.date))}</td></tr><tr><td>Valid till</td><td>${esc(dmy(till))}</td></tr></table></div></div>
    <div class="pfto"><div class="pflabel">Bill to</div><div class="pfname2">${esc(p.customer)}</div>${p.address ? `<div>${esc(p.address).replace(/\n/g, '<br>')}</div>` : ''}
      ${p.gstin ? `<div>GSTIN: <b>${esc(p.gstin)}</b></div>` : '<div>GSTIN: not registered</div>'}<div>Place of supply: ${esc(p.state || p.seller_state || '')}${bc ? ' (' + bc + ')' : ''}</div></div>
    <table class="pfitems"><thead><tr><th>#</th><th>Description of goods</th><th>HSN</th><th class="num">Quantity</th><th class="num">Rate</th><th class="num">GST</th><th class="num">Amount</th></tr></thead>
      <tbody>${p.lines.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.item)}</td><td>${esc(l.hsn)}</td><td class="num">${qty(l.qty, l.unit)}</td><td class="num">${money(l.rate)}</td><td class="num">${pct(l.gst)}</td><td class="num">${money(l.amount)}</td></tr>`).join('')}</tbody></table>
    <div class="pfbottom"><div class="pftax"><table><thead><tr><th class="num">GST rate</th><th class="num">Value</th>${p.interstate ? '<th class="num">IGST</th>' : '<th class="num">CGST</th><th class="num">SGST</th>'}</tr></thead><tbody>${taxRows}</tbody></table></div>
      <table class="pftotal"><tr><td>Value before GST</td><td class="num">${money(p.taxable)}</td></tr>${p.interstate ? `<tr><td>IGST</td><td class="num">${money(p.igst)}</td></tr>` : `<tr><td>CGST</td><td class="num">${money(p.cgst)}</td></tr><tr><td>SGST</td><td class="num">${money(p.sgst)}</td></tr>`}
        ${p.round_off ? `<tr><td>Round off</td><td class="num">${money(p.round_off)}</td></tr>` : ''}<tr class="grand"><td>Total</td><td class="num">${money(p.total)}</td></tr></table></div>
    <div class="pfwords">Amount in words: <b>${esc(p.in_words)}</b></div>
    ${p.notes ? `<div class="pfnote">${esc(p.notes).replace(/\n/g, '<br>')}</div>` : ''}
    <div class="pffoot"><div>${s.bank ? `<div class="pflabel">To pay</div><div>${esc(s.bank).replace(/\n/g, '<br>')}</div>` : ''}${s.terms ? `<div class="pflabel" style="margin-top:8px">Terms</div><div>${esc(s.terms).replace(/\n/g, '<br>')}</div>` : ''}</div>
      <div class="pfsign">For ${esc(s.name)}<br><br><br>Authorised signatory</div></div>
    <div class="pfsmall">This is a pro forma invoice, not a tax invoice. No GST is charged until the tax invoice is issued.${p.by ? ' Made by ' + esc(p.by) + '.' : ''}</div>
  </div>`;
}

boot();
</script>
</body>
</html>
